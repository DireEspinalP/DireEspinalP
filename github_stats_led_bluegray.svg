<svg width="440" height="200" viewBox="0 0 440 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0b0f1f"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Borde LED: azul oscuro <-> gris plateado -->
    <linearGradient id="ledBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047ab">
        <animate attributeName="stop-color" values="#0047ab;#8a94a6;#00c8ff;#0047ab" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8a94a6">
        <animate attributeName="stop-color" values="#8a94a6;#00c8ff;#0047ab;#8a94a6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c8ff">
        <animate attributeName="stop-color" values="#00c8ff;#0047ab;#8a94a6;#00c8ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#5c6b8a"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="434" height="194" rx="14" fill="url(#bg)"/>
  <rect x="3" y="3" width="434" height="194" rx="14" fill="none" stroke="url(#ledBorder)" stroke-width="6" filter="url(#neonGlow)" opacity="0.5"/>
  <rect x="3" y="3" width="434" height="194" rx="14" fill="none" stroke="url(#ledBorder)" stroke-width="2.2"/>

  <text x="26" y="34" font-family="'Courier New', Consolas, monospace" font-weight="bold"
        font-size="15.5" letter-spacing="1" fill="#00c8ff" filter="url(#softGlow)">
    DIRE D. ESPINAL-PECHO'S STATS
    <animate attributeName="fill" values="#00c8ff;#c9d1f0;#00c8ff" dur="3s" repeatCount="indefinite"/>
  </text>
  <rect x="26" y="42" width="150" height="2.5" fill="#8a94a6" filter="url(#softGlow)">
    <animate attributeName="width" values="150;190;150" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Courier New', Consolas, monospace" font-size="13.5" font-weight="bold">
    <text x="26" y="72" fill="#c9d1f0">★</text>
    <text x="46" y="72" fill="#9aa4bf">TOTAL STARS EARNED:</text>
    <text x="260" y="72" fill="#00c8ff" filter="url(#softGlow)">3</text>

    <text x="26" y="98" fill="#c9d1f0">⏱</text>
    <text x="46" y="98" fill="#9aa4bf">TOTAL COMMITS (LAST YEAR):</text>
    <text x="290" y="98" fill="#00c8ff" filter="url(#softGlow)">107</text>

    <text x="26" y="124" fill="#c9d1f0">⇅</text>
    <text x="46" y="124" fill="#9aa4bf">TOTAL PRs:</text>
    <text x="200" y="124" fill="#00c8ff" filter="url(#softGlow)">9</text>

    <text x="26" y="150" fill="#c9d1f0">!</text>
    <text x="46" y="150" fill="#9aa4bf">TOTAL ISSUES:</text>
    <text x="215" y="150" fill="#00c8ff" filter="url(#softGlow)">0</text>

    <text x="26" y="176" fill="#c9d1f0">⎘</text>
    <text x="46" y="176" fill="#9aa4bf">CONTRIBUTED TO (LAST YEAR):</text>
    <text x="298" y="176" fill="#00c8ff" filter="url(#softGlow)">1</text>
  </g>

  <!-- Grade circle -->
  <g transform="translate(378,100)">
    <circle r="36" fill="none" stroke="#151a2e" stroke-width="6"/>
    <circle r="36" fill="none" stroke="url(#arcGrad)" stroke-width="6"
            stroke-linecap="round" filter="url(#neonGlow)"
            stroke-dasharray="226.2" stroke-dashoffset="65"
            transform="rotate(-90)"/>
    <text x="0" y="7" text-anchor="middle" font-family="'Courier New', monospace"
          font-weight="bold" font-size="24" fill="#c9d1f0" filter="url(#softGlow)">C</text>
  </g>
</svg>
