<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a3f"/>
      <stop offset="20%" stop-color="#0a1a3f"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');

      .letter {
        font-family: 'Press Start 2P', monospace;
        font-size: 42px;
        fill: #ffffff;
        text-shadow: 0 0 8px rgba(168,85,247,0.8);
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-14px); }
        100% { transform: translateY(0px); }
      }

      .sub {
        font-family: 'Press Start 2P', monospace;
        font-size: 15px;
        letter-spacing: 3px;
        fill: #d8b4fe;
        opacity: 0.9;
        animation: subFloat 3.4s ease-in-out infinite;
      }
      @keyframes subFloat {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      /* pingüinos caminando por la habitación */
      .pen1 { animation: pen1move 6s ease-in-out infinite; }
      @keyframes pen1move {
        0%   { transform: translate(0px,0px); }
        20%  { transform: translate(120px,0px); }
        40%  { transform: translate(220px,0px); }
        60%  { transform: translate(140px,0px); }
        80%  { transform: translate(30px,0px); }
        100% { transform: translate(0px,0px); }
      }
      .pen1 .waddle { animation: waddle 0.4s ease-in-out infinite; }

      .pen2 { animation: pen2move 4.6s ease-in-out infinite; }
      @keyframes pen2move {
        0%   { transform: translate(0px,0px); }
        25%  { transform: translate(-90px,0px); }
        50%  { transform: translate(-10px,0px); }
        75%  { transform: translate(90px,0px); }
        100% { transform: translate(0px,0px); }
      }
      .pen2 .waddle { animation: waddle 0.35s ease-in-out infinite; }

      .pen3 { animation: pen3move 7.2s ease-in-out infinite; }
      @keyframes pen3move {
        0%   { transform: translate(0px,0px); }
        15%  { transform: translate(60px,0px); }
        35%  { transform: translate(180px,0px); }
        55%  { transform: translate(240px,0px); }
        75%  { transform: translate(110px,0px); }
        100% { transform: translate(0px,0px); }
      }
      .pen3 .waddle { animation: waddle 0.45s ease-in-out infinite; }

      /* pingüinos CORRIENDO: recorridos mas largos, ida y vuelta rapida con rebote */
      .pen4 { animation: pen4move 3s ease-in-out infinite; }
      @keyframes pen4move {
        0%   { transform: translate(0px,0px); }
        45%  { transform: translate(480px,-5px); }
        50%  { transform: translate(480px,0px); }
        95%  { transform: translate(0px,-5px); }
        100% { transform: translate(0px,0px); }
      }
      .pen4 .run { animation: run 0.22s ease-in-out infinite; }

      .pen5 { animation: pen5move 3.4s ease-in-out infinite; }
      @keyframes pen5move {
        0%   { transform: translate(0px,0px); }
        45%  { transform: translate(-380px,-4px); }
        50%  { transform: translate(-380px,0px); }
        95%  { transform: translate(0px,-4px); }
        100% { transform: translate(0px,0px); }
      }
      .pen5 .run { animation: run 0.2s ease-in-out infinite; }

      .pen6 { animation: pen6move 2.4s ease-in-out infinite; }
      @keyframes pen6move {
        0%   { transform: translate(0px,0px); }
        45%  { transform: translate(340px,-6px); }
        50%  { transform: translate(340px,0px); }
        95%  { transform: translate(0px,-6px); }
        100% { transform: translate(0px,0px); }
      }
      .pen6 .run { animation: run 0.18s ease-in-out infinite; }

      .pen7 { animation: pen7move 3.2s ease-in-out infinite; }
      @keyframes pen7move {
        0%   { transform: translate(0px,0px); }
        45%  { transform: translate(-250px,-5px); }
        50%  { transform: translate(-250px,0px); }
        95%  { transform: translate(0px,-5px); }
        100% { transform: translate(0px,0px); }
      }
      .pen7 .run { animation: run 0.21s ease-in-out infinite; }

      @keyframes waddle {
        0%   { transform: rotate(-6deg); }
        50%  { transform: rotate(6deg); }
        100% { transform: rotate(-6deg); }
      }

      @keyframes run {
        0%   { transform: rotate(-14deg) translateY(0px); }
        50%  { transform: rotate(14deg) translateY(-3px); }
        100% { transform: rotate(-14deg) translateY(0px); }
      }

      /* pantalla de la computadora parpadeando (código escribiéndose) */
      .codeline { animation: typeBlink 1.6s steps(1) infinite; }
      .codeline:nth-child(2) { animation-delay: 0.3s; }
      .codeline:nth-child(3) { animation-delay: 0.6s; }
      .codeline:nth-child(4) { animation-delay: 0.9s; }
      @keyframes typeBlink {
        0%   { opacity: 0.3; }
        50%  { opacity: 1; }
        100% { opacity: 0.3; }
      }

      /* manos del niño escribiendo */
      .hands { animation: typing 0.5s ease-in-out infinite; }
      @keyframes typing {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(2px); }
        100% { transform: translateY(0px); }
      }
    </style>

    <clipPath id="roomClip">
      <rect x="0" y="300" width="1200" height="320"/>
    </clipPath>
  </defs>

  <!-- ===== Encabezado con el nombre ===== -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g text-anchor="middle">
    <text x="270" y="140" class="letter" style="animation-delay:0.0s">D</text>
    <text x="320" y="140" class="letter" style="animation-delay:0.1s">I</text>
    <text x="370" y="140" class="letter" style="animation-delay:0.2s">R</text>
    <text x="420" y="140" class="letter" style="animation-delay:0.3s">E</text>
    <text x="530" y="140" class="letter" style="animation-delay:0.4s">E</text>
    <text x="580" y="140" class="letter" style="animation-delay:0.5s">S</text>
    <text x="630" y="140" class="letter" style="animation-delay:0.6s">P</text>
    <text x="680" y="140" class="letter" style="animation-delay:0.7s">I</text>
    <text x="730" y="140" class="letter" style="animation-delay:0.8s">N</text>
    <text x="780" y="140" class="letter" style="animation-delay:0.9s">A</text>
    <text x="830" y="140" class="letter" style="animation-delay:1.0s">L</text>
  </g>
  <text x="600" y="195" text-anchor="middle" class="sub">(CIENCIA DE LA COMPUTACION UNI-PERU)</text>

  <!-- ===== Panel inferior: habitación pixel art ===== -->
  <g clip-path="url(#roomClip)">
    <rect x="0" y="300" width="1200" height="320" fill="#1b1330"/>
    <rect x="0" y="300" width="1200" height="180" fill="#241a44"/>

    <!-- ventana -->
    <g>
      <rect x="60" y="325" width="90" height="70" fill="#0a1a3f" stroke="#4c1d95" stroke-width="6"/>
      <rect x="60" y="325" width="90" height="6" fill="#4c1d95"/>
      <rect x="60" y="357" width="90" height="6" fill="#4c1d95"/>
      <rect x="102" y="325" width="6" height="70" fill="#4c1d95"/>
      <circle cx="130" cy="340" r="6" fill="#facc15"/>
    </g>

    <!-- reloj de pared -->
    <g transform="translate(400,330)">
      <circle cx="0" cy="0" r="18" fill="#f5f5f5" stroke="#4c1d95" stroke-width="4"/>
      <rect x="-2" y="-12" width="4" height="12" fill="#1b1330"/>
      <rect x="0" y="-2" width="10" height="4" fill="#1b1330"/>
    </g>

    <!-- cuadro / poster en la pared -->
    <g transform="translate(560,320)">
      <rect x="0" y="0" width="60" height="46" fill="#facc15" stroke="#4c1d95" stroke-width="5"/>
      <rect x="8" y="8" width="44" height="30" fill="#0a1a3f"/>
      <rect x="20" y="16" width="20" height="14" fill="#22d3ee"/>
    </g>

    <!-- estante con libros -->
    <g>
      <rect x="950" y="355" width="210" height="8" fill="#4c1d95"/>
      <rect x="960" y="325" width="14" height="30" fill="#a855f7"/>
      <rect x="978" y="320" width="14" height="35" fill="#facc15"/>
      <rect x="996" y="330" width="14" height="25" fill="#22d3ee"/>
      <rect x="1014" y="315" width="14" height="40" fill="#f472b6"/>
      <rect x="1032" y="325" width="14" height="30" fill="#4ade80"/>
    </g>

    <!-- piso -->
    <rect x="0" y="480" width="1200" height="140" fill="#150e28"/>
    <g stroke="#2a1f4d" stroke-width="2">
      <line x1="0" y1="505" x2="1200" y2="505"/>
      <line x1="0" y1="535" x2="1200" y2="535"/>
      <line x1="0" y1="565" x2="1200" y2="565"/>
      <line x1="0" y1="595" x2="1200" y2="595"/>
    </g>

    <!-- cama -->
    <g transform="translate(50,470)">
      <rect x="0" y="30" width="150" height="70" fill="#5b21b6"/>
      <rect x="0" y="30" width="150" height="10" fill="#7e22ce"/>
      <rect x="10" y="15" width="40" height="20" fill="#f5f5f5" stroke="#a855f7" stroke-width="3"/>
      <rect x="-6" y="20" width="10" height="80" fill="#3b2412"/>
      <rect x="150" y="20" width="10" height="80" fill="#3b2412"/>
    </g>

    <!-- mesa de noche con lámpara -->
    <g transform="translate(215,510)">
      <rect x="0" y="20" width="40" height="40" fill="#3b2412"/>
      <rect x="10" y="-10" width="6" height="30" fill="#facc15"/>
      <path d="M0,-10 L22,-10 L16,-24 L6,-24 Z" fill="#fde68a"/>
    </g>

    <!-- planta -->
    <g transform="translate(300,545)">
      <rect x="0" y="10" width="24" height="20" fill="#78350f"/>
      <circle cx="12" cy="0" r="12" fill="#22c55e"/>
      <circle cx="0" cy="6" r="9" fill="#16a34a"/>
      <circle cx="24" cy="6" r="9" fill="#16a34a"/>
    </g>

    <!-- alfombra bajo el escritorio -->
    <rect x="620" y="510" width="280" height="90" fill="#5b21b6"/>
    <rect x="640" y="528" width="240" height="54" fill="#7e22ce"/>

    <!-- ===== Escritorio con computadora ===== -->
    <g transform="translate(660,430)">
      <!-- monitor -->
      <rect x="30" y="0" width="90" height="65" fill="#0a1a3f" stroke="#a855f7" stroke-width="5"/>
      <rect x="70" y="65" width="10" height="14" fill="#4c1d95"/>
      <rect x="55" y="79" width="40" height="6" fill="#4c1d95"/>
      <!-- lineas de código en pantalla -->
      <g>
        <rect class="codeline" x="40" y="12" width="35" height="5" fill="#4ade80"/>
        <rect class="codeline" x="40" y="24" width="55" height="5" fill="#22d3ee"/>
        <rect class="codeline" x="40" y="36" width="25" height="5" fill="#facc15"/>
        <rect class="codeline" x="40" y="48" width="45" height="5" fill="#f472b6"/>
      </g>

      <!-- escritorio -->
      <rect x="-30" y="90" width="220" height="14" fill="#78350f"/>
      <rect x="-24" y="104" width="10" height="60" fill="#4c1d94"/>
      <rect x="180" y="104" width="10" height="60" fill="#4c1d94"/>

      <!-- teclado -->
      <rect x="10" y="80" width="70" height="12" fill="#241a44" stroke="#a855f7" stroke-width="2"/>

      <!-- torre CPU con pingüino sticker -->
      <rect x="150" y="60" width="30" height="44" fill="#1b1330" stroke="#4c1d95" stroke-width="3"/>
      <circle cx="165" cy="75" r="5" fill="#fbbf24"/>
    </g>

    <!-- ===== Niño con lentes programando, sentado ===== -->
    <g transform="translate(700,470)">
      <!-- silla -->
      <rect x="-10" y="55" width="55" height="8" fill="#241a44"/>
      <rect x="-16" y="20" width="8" height="45" fill="#241a44"/>

      <!-- piernas sentado -->
      <rect x="0" y="45" width="14" height="20" fill="#312e81"/>
      <rect x="20" y="45" width="14" height="20" fill="#312e81"/>

      <!-- cuerpo -->
      <rect x="-2" y="18" width="38" height="28" fill="#22d3ee"/>

      <!-- brazos hacia el teclado -->
      <g class="hands">
        <rect x="-12" y="30" width="12" height="8" fill="#f2c199"/>
        <rect x="34" y="30" width="12" height="8" fill="#f2c199"/>
      </g>

      <!-- cabeza -->
      <rect x="2" y="0" width="30" height="18" fill="#f2c199"/>
      <rect x="0" y="-8" width="34" height="10" fill="#3b2412"/>

      <!-- lentes -->
      <rect x="4" y="6" width="10" height="8" fill="#0a1a3f" stroke="#ffffff" stroke-width="2"/>
      <rect x="18" y="6" width="10" height="8" fill="#0a1a3f" stroke="#ffffff" stroke-width="2"/>
      <rect x="14" y="8" width="4" height="2" fill="#ffffff"/>
    </g>

    <!-- ===== Pingüinos Tux caminando por la habitación ===== -->
    <g class="pen1" transform="translate(300,548)">
      <g class="waddle">
        <rect x="4" y="0" width="14" height="6" fill="#000000"/>
        <rect x="0" y="6" width="22" height="18" fill="#000000"/>
        <rect x="4" y="10" width="14" height="12" fill="#ffffff"/>
        <rect x="6" y="4" width="4" height="4" fill="#ffffff"/>
        <rect x="8" y="8" width="6" height="4" fill="#f97316"/>
        <rect x="2" y="24" width="18" height="4" fill="#f97316"/>
        <rect x="0" y="10" width="4" height="10" fill="#000000"/>
        <rect x="18" y="10" width="4" height="10" fill="#000000"/>
      </g>
    </g>

    <g class="pen2" transform="translate(450,555)">
      <g class="waddle">
        <rect x="4" y="0" width="14" height="6" fill="#000000"/>
        <rect x="0" y="6" width="22" height="18" fill="#000000"/>
        <rect x="4" y="10" width="14" height="12" fill="#ffffff"/>
        <rect x="6" y="4" width="4" height="4" fill="#ffffff"/>
        <rect x="8" y="8" width="6" height="4" fill="#f97316"/>
        <rect x="2" y="24" width="18" height="4" fill="#f97316"/>
        <rect x="0" y="10" width="4" height="10" fill="#000000"/>
        <rect x="18" y="10" width="4" height="10" fill="#000000"/>
      </g>
    </g>

    <g class="pen3" transform="translate(180,560)">
      <g class="waddle">
        <rect x="4" y="0" width="14" height="6" fill="#000000"/>
        <rect x="0" y="6" width="22" height="18" fill="#000000"/>
        <rect x="4" y="10" width="14" height="12" fill="#ffffff"/>
        <rect x="6" y="4" width="4" height="4" fill="#ffffff"/>
        <rect x="8" y="8" width="6" height="4" fill="#f97316"/>
        <rect x="2" y="24" width="18" height="4" fill="#f97316"/>
        <rect x="0" y="10" width="4" height="10" fill="#000000"/>
        <rect x="18" y="10" width="4" height="10" fill="#000000"/>
      </g>
    </g>

    <!-- ===== Pingüinos CORRIENDO de un lado a otro de la habitación ===== -->
    <g class="pen4" transform="translate(60,590)">
      <g class="run">
        <rect x="4" y="0" width="12" height="5" fill="#000000"/>
        <rect x="0" y="5" width="19" height="15" fill="#000000"/>
        <rect x="3" y="8" width="12" height="10" fill="#ffffff"/>
        <rect x="5" y="3" width="4" height="4" fill="#ffffff"/>
        <rect x="7" y="7" width="5" height="3" fill="#f97316"/>
        <rect x="1" y="20" width="16" height="3" fill="#f97316"/>
        <rect x="-3" y="16" width="6" height="4" fill="#f97316"/>
        <rect x="16" y="16" width="6" height="4" fill="#f97316"/>
      </g>
    </g>

    <g class="pen5" transform="translate(650,596)">
      <g class="run">
        <rect x="4" y="0" width="12" height="5" fill="#000000"/>
        <rect x="0" y="5" width="19" height="15" fill="#000000"/>
        <rect x="3" y="8" width="12" height="10" fill="#ffffff"/>
        <rect x="5" y="3" width="4" height="4" fill="#ffffff"/>
        <rect x="7" y="7" width="5" height="3" fill="#f97316"/>
        <rect x="1" y="20" width="16" height="3" fill="#f97316"/>
        <rect x="-3" y="16" width="6" height="4" fill="#f97316"/>
        <rect x="16" y="16" width="6" height="4" fill="#f97316"/>
      </g>
    </g>

    <g class="pen6" transform="translate(120,604)">
      <g class="run">
        <rect x="4" y="0" width="12" height="5" fill="#000000"/>
        <rect x="0" y="5" width="19" height="15" fill="#000000"/>
        <rect x="3" y="8" width="12" height="10" fill="#ffffff"/>
        <rect x="5" y="3" width="4" height="4" fill="#ffffff"/>
        <rect x="7" y="7" width="5" height="3" fill="#f97316"/>
        <rect x="1" y="20" width="16" height="3" fill="#f97316"/>
        <rect x="-3" y="16" width="6" height="4" fill="#f97316"/>
        <rect x="16" y="16" width="6" height="4" fill="#f97316"/>
      </g>
    </g>

    <g class="pen7" transform="translate(1000,584)">
      <g class="run">
        <rect x="4" y="0" width="12" height="5" fill="#000000"/>
        <rect x="0" y="5" width="19" height="15" fill="#000000"/>
        <rect x="3" y="8" width="12" height="10" fill="#ffffff"/>
        <rect x="5" y="3" width="4" height="4" fill="#ffffff"/>
        <rect x="7" y="7" width="5" height="3" fill="#f97316"/>
        <rect x="1" y="20" width="16" height="3" fill="#f97316"/>
        <rect x="-3" y="16" width="6" height="4" fill="#f97316"/>
        <rect x="16" y="16" width="6" height="4" fill="#f97316"/>
      </g>
    </g>
  </g>

  <!-- borde del panel inferior -->
  <rect x="0" y="300" width="1200" height="320" fill="none" stroke="#a855f7" stroke-width="4"/>
</svg>
